<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00f3ff"/><stop offset="1" stop-color="#7a00ff"/></linearGradient>
    <filter id="noise"><feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="c"><rect x="0" y="0" width="1200" height="220"/></clipPath>
    <style><![CDATA[
      .t{font-family: 'Orbitron', sans-serif; font-weight:700; font-size:72px; fill:url(#g); text-anchor:middle;}
      .layer{mix-blend-mode:screen;}
      .g1 { transform-origin:600px 110px; animation: glitch1 3s infinite steps(2); }
      .g2 { transform-origin:600px 110px; animation: glitch2 2.2s infinite steps(2); opacity:0.8;}
      @keyframes glitch1 {
        0% { transform: translate(0,0) skewX(0); }
        20% { transform: translate(-8px,-2px) skewX(-2deg); }
        40% { transform: translate(6px,2px) skewX(1deg); }
        60% { transform: translate(-4px,1px) skewX(-1deg); }
        80% { transform: translate(3px,-1px) skewX(2deg); }
        100% { transform: translate(0,0) skewX(0); }
      }
      @keyframes glitch2 {
        0% { transform: translate(0,0) scale(1); opacity:0.7;}
        25% { transform: translate(12px,3px) scale(1.02); opacity:1;}
        50% { transform: translate(-10px,-4px) scale(0.98); opacity:0.6;}
        75% { transform: translate(6px,2px) scale(1.01); opacity:0.9;}
        100% { transform: translate(0,0) scale(1); opacity:0.8;}
      }
    ]]></style>
  </defs>

  <rect width="100%" height="100%" fill="#02020a"/>
  <g clip-path="url(#c)">
    <text x="600" y="120" class="t layer g1" fill="#00ffd5">Lemi Negeso</text>
    <text x="600" y="120" class="t layer g2" fill="#ff00d4">Lemi Negeso</text>
    <text x="600" y="120" class="t" opacity="0.25">Lemi Negeso</text>
  </g>
  <rect x="0" y="0" width="1200" height="220" fill="transparent"/>
</svg>