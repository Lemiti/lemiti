<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80">
  <defs>
    <linearGradient id="ng" x1="0" x2="1"><stop offset="0" stop-color="#00f3ff"/><stop offset="1" stop-color="#7a00ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      .bar{fill:url(#ng); filter:url(#glow); opacity:0.95;}
    ]]></style>
  </defs>
  <rect width="100%" height="100%" fill="#03030b"/>
  <g transform="translate(100,20)">
    <rect class="bar" x="0" y="0" width="1000" height="12" rx="6"/>
    <g transform="translate(0, -8)">
      <rect x="0" y="18" width="200" height="3" rx="2" fill="#00f3ff" opacity="0.18"/>
      <rect x="400" y="18" width="380" height="3" rx="2" fill="#7a00ff" opacity="0.18"/>
    </g>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </g>
</svg>