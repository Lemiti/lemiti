<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80">
  <defs>
    <linearGradient id="ne" x1="0" x2="1"><stop offset="0" stop-color="#7a00ff"/><stop offset="1" stop-color="#00f3ff"/></linearGradient>
    <style><![CDATA[
      .bg{fill:#02030a;}
      .line{fill:url(#ne); filter: blur(8px); opacity:0.95;}
    ]]></style>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
  <g transform="translate(80,20)">
    <rect class="line" x="0" y="0" width="1040" height="8" rx="4"></rect>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </g>
</svg>