<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="ngh" x1="0" x2="1"><stop offset="0" stop-color="#00f3ff"/><stop offset="1" stop-color="#7a00ff"/></linearGradient>
    <style><![CDATA[
      .bg{fill:#03030b;}
      .c{fill:url(#ngh); font-family:Orbitron, sans-serif; font-weight:700; font-size:28px;}
      .ring{stroke:url(#ngh); stroke-width:2; fill:none; filter: url(#blur);}
      @keyframes glow { 0%{opacity:0.6}50%{opacity:1}100%{opacity:0.6} }
    ]]></style>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
  <g transform="translate(60,60)" text-anchor="middle">
    <circle r="34" fill="#010114" stroke="#00f3ff" stroke-opacity="0.12"/>
    <text class="c" y="8">GH</text>
  </g>
